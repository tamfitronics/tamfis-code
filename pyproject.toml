[project]
name = "tamfis-code"
version = "1.6.6"
description = "TamfisGPT Code -- portable subscription-backed terminal coding agent with local tools, PTY, plans, queues, and approvals"
readme = "README.md"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "rich>=13.0",
    "prompt_toolkit>=3.0",
    # Provider calls (providers.py) go through the openai SDK's client against
    # each provider's OpenAI-compatible endpoint (Ollama Cloud, NVIDIA NIM, HF, OpenRouter)
    # -- this was imported but never declared, only working because a
    # copy happened to already be installed system-wide.
    "openai>=1.30",
    # Outbound MCP server (`tamfis-code mcp-server`, mcp_stdio_server.py) --
    # was already installed system-wide and imported ad hoc; same class of
    # undeclared-dependency gap as openai/pytest-asyncio above, now fixed.
    "mcp>=1.2",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "websockets>=13",
    "playwright>=1.50",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
    "reportlab>=4.2",
    "pypdf>=5.0",
]

[project.entry-points."tamfis_code.plugins"]
# Third-party packages may register plugin factory callables in this group.
# The runtime discovers them without importing a TamfisGPT server checkout.

[project.scripts]
tamfis-code = "tamfis_code.cli:main"
tamgpt-code = "tamfis_code.cli:main"
tamfis = "tamfis_code.cli:main"
tamfis-code-server = "tamfis_code.openhands.agent_server:main"

[project.urls]
Homepage = "https://github.com/tamfitronics/tamfis-code"
Repository = "https://github.com/tamfitronics/tamfis-code"

[project.optional-dependencies]
dev = [
    "build>=1.0",
    "twine>=5.0",
    "pytest>=8.0",
    # tests/test_agents.py and tests/test_mcp.py use @pytest.mark.asyncio --
    # this was only working locally because a copy happened to already be
    # installed system-wide (same class of gap as the openai dependency above).
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tamfis_code*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
    "tests.backup.*",
    ".git",
    ".pytest_cache",
    "__pycache__",
]
