name: CI

# Runs the full test suite on every PR and push to main -- this is the
# gate publish.yml doesn't provide (that one only fires on `v*` tags, so
# without this workflow nothing runs the suite until someone cuts a release).

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # sandbox.py's build_sandbox_command now defaults to fail-closed on
      # Linux when bubblewrap is missing (see the 2026-08-21 sandbox
      # fail-closed commit) -- ubuntu-latest doesn't ship it, so every real
      # execute_command call in the suite would raise RuntimeError instead
      # of running, without this. Live-confirmed as the actual cause of a
      # cluster of "'failed' != 'completed'" test failures on the first CI
      # run after that change landed.
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
      # Live-confirmed root cause (previous run's diagnostic step, since
      # removed): bwrap installs fine but every sandboxed command failed
      # at bwrap's own startup with "loopback: Failed RTM_NEWADDR:
      # Operation not permitted" -- not a missing-binary problem.
      # kernel.unprivileged_userns_clone was already 1 (unrestricted), so
      # this is Ubuntu 24.04's newer, separate AppArmor restriction on
      # unprivileged user namespaces (LP #2046844), which additionally
      # blocks the netlink call bwrap's own loopback-up step needs even
      # once namespace creation itself is allowed. This CI runner is
      # ephemeral and single-tenant per job -- relaxing this specific
      # restriction here doesn't weaken anything the sandbox itself is
      # meant to protect (the sandbox's job is isolating the test-suite's
      # own commands from each other/the host, not defending against a
      # hostile CI runner).
      - name: Allow unprivileged user namespaces (Ubuntu's AppArmor confinement policy otherwise blocks bwrap's own loopback setup)
        run: sudo sysctl -w kernel.unprivileged_userns_apparmor_policy=0
      - run: pip install -e ".[dev]"
      - name: Artifact benchmark corpus (provider-independent quality gate)
        run: pytest -q tests/test_artifact_benchmark_corpus.py
      - run: pytest -q
